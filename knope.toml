# Releases: each change adds a note with `knope document-change` (in nix develop); every push to
# main keeps one release PR up to date (.github/workflows/prepare-release.yml), and merging it
# signs the Firefox extension and publishes it as a GitHub release (release.yml).

[package]
versioned_files = ["package.json"]
changelog = "CHANGELOG.md"
assets = "artifacts/*"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

# package.json holds the version; the extension's manifest.json, which the Nix build reads,
# follows it. knope drops package.json's final newline, which prettier wants back.
[[workflows.steps]]
type = "Command"
command = "sed -i -e '$a\\' package.json && node scripts/sync-manifest-version.mjs && git add package.json extension/static/manifest.json"
shell = true

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "Merging this signs the Firefox extension and publishes $version as a GitHub release.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "xav-ie"
repo = "virtual-headset"
