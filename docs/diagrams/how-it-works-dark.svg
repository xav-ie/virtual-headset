<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 544" width="1062" height="544" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef0f4; }
  .bg { fill: #1c1f26; }
  .box { fill: #262a33; stroke: #3b414e; stroke-width: 2; }
  .key { fill: #ff4d7d; fill-opacity: .08; stroke: #ff4d7d; stroke-width: 2.5; }
  .head { font-size: 19px; font-weight: 700; }
  .lede { font-size: 14.5px; fill: #a7aebd; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #a7aebd; }
  .label { font-size: 13px; font-weight: 600; fill: #eef0f4; }
  .axis { font-size: 12.5px; fill: #a7aebd; }
  .axis-strong { font-size: 12.5px; font-weight: 650; fill: #eef0f4; }
  .edge { fill: none; stroke: #a3abbd; stroke-width: 2; marker-end: url(#arrow); }
  .tick { stroke: #a7aebd; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .tag { fill: #1c1f26; }
  .arrowhead { fill: #a3abbd; }
  .badge { fill: #ff4d7d; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .ink { fill: none; stroke: #eef0f4; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-live { fill: none; stroke: #ff4d7d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .seg-quiet { fill: #262a33; stroke: #3b414e; stroke-width: 1.5; }
  .seg-live { fill: #ff4d7d; fill-opacity: .2; stroke: #ff4d7d; stroke-width: 1.5; }
  .seg-ok { fill: #5ad18a; fill-opacity: .2; stroke: #5ad18a; stroke-width: 1.5; }
  .seg-mono { fill: #a3abbd; fill-opacity: .16; stroke: #a3abbd; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="544"/><text class="head" x="24" y="36">Zoom and Meet only obey a headset's mute button. Virtual Headset gives your mic one</text><text class="lede" x="24" y="60">your call app sees an ordinary USB headset: a microphone with your voice, a mute button it listens to, and a mute light it turns on</text><text class="axis-strong" x="254.3" y="108" text-anchor="middle">YOU</text><text class="axis-strong" x="587" y="108" text-anchor="middle">VIRTUAL HEADSET</text><text class="axis-strong" x="919.7" y="108" text-anchor="middle">ZOOM OR MEET</text><text class="title" x="24" y="187">Your voice</text><text class="title" x="24" y="327">Mute</text><text class="title" x="24" y="467">What you see</text><rect class="box" x="136" y="122" width="236.7" height="118" rx="14"/><path class="ink" transform="translate(254.3 156.1)" d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16"/><text class="title" x="254.3" y="206.1" text-anchor="middle">Your mic</text><text class="sub" x="254.3" y="225.9" text-anchor="middle">built-in, USB or Bluetooth</text><rect class="key" x="468.7" y="122" width="236.7" height="118" rx="14"/><path class="ink-live" transform="translate(587 156.1)" d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3"/><text class="title" x="587" y="206.1" text-anchor="middle">Its microphone</text><text class="sub" x="587" y="225.9" text-anchor="middle">noise removed, if you like</text><rect class="box" x="801.3" y="122" width="236.7" height="118" rx="14"/><path class="ink" transform="translate(919.7 156.1)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="919.7" y="206.1" text-anchor="middle">Zoom hears you</text><text class="sub" x="919.7" y="225.9" text-anchor="middle">as from any headset</text><rect class="box" x="136" y="262" width="236.7" height="118" rx="14"/><path class="ink" transform="translate(254.3 296.1)" d="M-21 -12h42a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-42a4 4 0 0 1 -4 -4v-18a4 4 0 0 1 4 -4zM-16 -5h2M-8 -5h2M0 -5h2M8 -5h2M16 -5h2M-12 2h2M-4 2h2M4 2h2M12 2h2M-10 8h20"/><text class="title" x="254.3" y="346.1" text-anchor="middle">You press mute</text><text class="sub" x="254.3" y="365.9" text-anchor="middle">a key, menu bar or panel</text><rect class="key" x="468.7" y="262" width="236.7" height="118" rx="14"/><path class="ink-live" transform="translate(587 296.1)" d="M0 -18a18 18 0 1 1 0 36a18 18 0 1 1 0 -36zM0 -8a8 8 0 1 1 0 16a8 8 0 1 1 0 -16z"/><text class="title" x="587" y="346.1" text-anchor="middle">Its mute button</text><text class="sub" x="587" y="365.9" text-anchor="middle">the one call apps obey</text><rect class="box" x="801.3" y="262" width="236.7" height="118" rx="14"/><path class="ink" transform="translate(919.7 296.1)" d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16M-18 -18L18 18"/><text class="title" x="919.7" y="346.1" text-anchor="middle">Zoom mutes</text><text class="sub" x="919.7" y="365.9" text-anchor="middle">as if you clicked its button</text><rect class="box" x="136" y="402" width="236.7" height="118" rx="14"/><path class="ink" transform="translate(254.3 436.1)" d="M-24 -18h48v9h-48zM-19 -13.5h6M-9 -13.5h6M11 -13.5h3M18 -13.5h2M4 -4h20v22h-20zM8 3h12M8 10h8"/><text class="title" x="254.3" y="486.1" text-anchor="middle">You see muted</text><text class="sub" x="254.3" y="505.9" text-anchor="middle">in your menu bar and panel</text><rect class="key" x="468.7" y="402" width="236.7" height="118" rx="14"/><path class="ink-live" transform="translate(587 436.1)" d="M0 -8a8 8 0 1 1 0 16a8 8 0 1 1 0 -16zM0 -21v6M0 15v6M-21 0h6M15 0h6M-15 -15l4 4M11 11l4 4M-15 15l4 -4M11 -11l4 -4"/><text class="title" x="587" y="486.1" text-anchor="middle">Its mute light</text><text class="sub" x="587" y="505.9" text-anchor="middle">on while you're muted</text><rect class="box" x="801.3" y="402" width="236.7" height="118" rx="14"/><path class="ink" transform="translate(919.7 436.1)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="919.7" y="486.1" text-anchor="middle">Zoom turns it on</text><text class="sub" x="919.7" y="505.9" text-anchor="middle">even if you muted in Zoom</text><path class="edge" d="M372.7 181L468.7 181"/><path class="edge" d="M705.3 181L801.3 181"/><path class="edge" d="M372.7 321L468.7 321"/><path class="edge" d="M705.3 321L801.3 321"/><path class="edge" d="M801.3 461L705.3 461"/><path class="edge" d="M468.7 461L372.7 461"/></svg>
