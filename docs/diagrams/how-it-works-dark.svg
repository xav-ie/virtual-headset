<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 440" width="1062" height="440" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eef0f4; }
  .bg { fill: #1c1f26; }
  .box { fill: #262a33; stroke: #3b414e; stroke-width: 2; }
  .key { fill: #ff4d7d; fill-opacity: .08; stroke: #ff4d7d; stroke-width: 2.5; }
  .head { font-size: 19px; font-weight: 700; }
  .lede { font-size: 14.5px; fill: #a7aebd; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #a7aebd; }
  .label { font-size: 13px; font-weight: 600; fill: #eef0f4; }
  .axis { font-size: 12.5px; fill: #a7aebd; }
  .axis-strong { font-size: 12.5px; font-weight: 650; fill: #eef0f4; }
  .edge { fill: none; stroke: #a3abbd; stroke-width: 2; marker-end: url(#arrow); }
  .tick { stroke: #a7aebd; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .tag { fill: #1c1f26; }
  .arrowhead { fill: #a3abbd; }
  .badge { fill: #ff4d7d; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .ink { fill: none; stroke: #eef0f4; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-live { fill: none; stroke: #ff4d7d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .seg-quiet { fill: #262a33; stroke: #3b414e; stroke-width: 1.5; }
  .seg-live { fill: #ff4d7d; fill-opacity: .2; stroke: #ff4d7d; stroke-width: 1.5; }
  .seg-ok { fill: #5ad18a; fill-opacity: .2; stroke: #5ad18a; stroke-width: 1.5; }
  .seg-mono { fill: #a3abbd; fill-opacity: .16; stroke: #a3abbd; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="440"/><text class="head" x="24" y="36">Your call app thinks you plugged in a headset</text><text class="lede" x="24" y="60">so its mute and yours are the same button, and your voice goes through it</text><rect class="box" x="24" y="92" width="238" height="150" rx="14"/><path class="ink" transform="translate(143 142.1)" d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16"/><text class="title" x="143" y="192.1" text-anchor="middle">Your mic</text><text class="sub" x="143" y="211.9" text-anchor="middle">built-in, USB or Bluetooth</text><rect class="box" x="24" y="266" width="238" height="150" rx="14"/><path class="ink" transform="translate(143 307)" d="M-21 -12h42a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-42a4 4 0 0 1 -4 -4v-18a4 4 0 0 1 4 -4zM-16 -5h2M-8 -5h2M0 -5h2M8 -5h2M16 -5h2M-12 2h2M-4 2h2M4 2h2M12 2h2M-10 8h20"/><text class="title" x="143" y="357" text-anchor="middle">Your mute controls</text><text class="sub" x="143" y="376.8" text-anchor="middle">a key, your menu or status</text><text class="sub" x="143" y="395" text-anchor="middle">bar, a panel, the browser</text><rect class="key" x="412" y="92" width="238" height="324" rx="14"/><path class="ink-live" transform="translate(531 220)" d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3"/><text class="title" x="531" y="270" text-anchor="middle">Virtual Headset</text><text class="sub" x="531" y="289.8" text-anchor="middle">a headset made in software:</text><text class="sub" x="531" y="308" text-anchor="middle">a mic and a mute button</text><rect class="box" x="800" y="92" width="238" height="324" rx="14"/><path class="ink" transform="translate(919 210.9)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="919" y="260.9" text-anchor="middle">Zoom or Meet</text><text class="sub" x="919" y="280.7" text-anchor="middle">sees a headset, and keeps</text><text class="sub" x="919" y="298.9" text-anchor="middle">its own mute button in sync</text><text class="sub" x="919" y="317.1" text-anchor="middle">with yours</text><path class="edge" d="M262 167L412 167"/><rect class="tag" x="294.9" y="139" width="84.2" height="22" rx="6"/><text class="label" x="301.9" y="154.5">your voice</text><path class="edge" d="M650 167L800 167"/><rect class="tag" x="682.9" y="139" width="84.2" height="22" rx="6"/><text class="label" x="689.9" y="154.5">your voice</text><path class="edge" d="M262 326L412 326"/><rect class="tag" x="294.9" y="298" width="84.2" height="22" rx="6"/><text class="label" x="301.9" y="313.5">press mute</text><path class="edge" d="M412 356L262 356"/><rect class="tag" x="298.4" y="362" width="77.2" height="22" rx="6"/><text class="label" x="305.4" y="377.5">show mute</text><path class="edge" d="M650 326L800 326"/><rect class="tag" x="679.4" y="298" width="91.2" height="22" rx="6"/><text class="label" x="686.4" y="313.5">mute button</text><path class="edge" d="M800 356L650 356"/><rect class="tag" x="682.9" y="362" width="84.2" height="22" rx="6"/><text class="label" x="689.9" y="377.5">mute light</text></svg>
