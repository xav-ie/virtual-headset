<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 574" width="1062" height="574" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2129; }
  .bg { fill: #f5f6f9; }
  .box { fill: #ffffff; stroke: #d6dae3; stroke-width: 2; }
  .key { fill: #e0245e; fill-opacity: .1; stroke: #e0245e; stroke-width: 2.5; }
  .end { fill: #4d5566; fill-opacity: .14; stroke: #4d5566; stroke-width: 2; }
  .group { fill: none; stroke: #5d6576; stroke-width: 1.5; stroke-dasharray: 6 5; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #5d6576; }
  .label { font-size: 13px; font-weight: 550; fill: #4d5566; }
  .axis { font-size: 12.5px; fill: #5d6576; }
  .edge { fill: none; stroke: #4d5566; stroke-width: 2; marker-end: url(#arrow); }
  .tick { stroke: #5d6576; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .tag { fill: #f5f6f9; }
  .head { fill: #4d5566; }
  .seg-quiet { fill: #ffffff; stroke: #d6dae3; stroke-width: 1.5; }
  .seg-live { fill: #e0245e; fill-opacity: .2; stroke: #e0245e; stroke-width: 1.5; }
  .seg-ok { fill: #23864f; fill-opacity: .2; stroke: #23864f; stroke-width: 1.5; }
  .seg-mono { fill: #4d5566; fill-opacity: .16; stroke: #4d5566; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="574"/><rect class="box" x="24" y="24" width="1014" height="78" rx="14"/><text class="title" x="531" y="59.1" text-anchor="middle">You press mute</text><text class="sub" x="531" y="78.2" text-anchor="middle">a key, your status bar, the panel or the browser toolbar</text><rect class="key" x="24" y="136" width="1014" height="78" rx="14"/><text class="title" x="531" y="171.1" text-anchor="middle">Virtual_Headset presses its mute button</text><text class="sub" x="531" y="190.2" text-anchor="middle">the button of a telephony headset, which Zoom and Meet obey</text><rect class="box" x="24" y="248" width="1014" height="78" rx="14"/><text class="title" x="531" y="283.1" text-anchor="middle">Zoom or Meet mutes</text><text class="sub" x="531" y="302.2" text-anchor="middle">exactly as if you had clicked its own mic button</text><rect class="key" x="24" y="360" width="1014" height="78" rx="14"/><text class="title" x="531" y="395.1" text-anchor="middle">It lights the headset's mute light</text><text class="sub" x="531" y="414.2" text-anchor="middle">and does the same when you mute inside the call app</text><rect class="end" x="24" y="472" width="1014" height="78" rx="14"/><text class="title" x="531" y="507.1" text-anchor="middle">Every indicator follows</text><text class="sub" x="531" y="526.2" text-anchor="middle">status bar, panel and browser icon; on macOS the real mic is also released</text><path class="edge" d="M531 102L531 136"/><path class="edge" d="M531 214L531 248"/><path class="edge" d="M531 326L531 360"/><path class="edge" d="M531 438L531 472"/></svg>
