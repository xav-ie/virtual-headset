<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 286" width="1062" height="286" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2129; }
