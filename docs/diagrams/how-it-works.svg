<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="286" role="img" viewBox="0 0 1062 286"><style>text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#1d2129}.bg{fill:#f5f6f9}.box{fill:#fff;stroke:#d6dae3;stroke-width:2}.key{fill:#e0245e;fill-opacity:.08;stroke:#e0245e;stroke-width:2.5}.head{font-size:19px;font-weight:700}.lede{font-size:14.5px;fill:#5d6576}.title{font-size:16px;font-weight:650}.sub{font-size:13.5px;fill:#5d6576}.edge{fill:none;stroke:#4d5566;stroke-width:2;marker-end:url(#arrow)}.arrowhead{fill:#4d5566}.ink,.ink-live{fill:none;stroke:#1d2129;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.ink-live{stroke:#e0245e}</style><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect width="1062" height="286" class="bg" rx="16"/><text x="24" y="36" class="head">Your call app thinks your mic is a headset, so it obeys your mute key</text><text x="24" y="60" class="lede">Virtual Headset is an ordinary USB headset, made in software</text><rect width="258" height="170" x="24" y="92" class="box" rx="14"/><path d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16" class="ink" transform="translate(153 152.1)"/><text x="153" y="202.1" class="title" text-anchor="middle">Your mic</text><text x="153" y="221.9" class="sub" text-anchor="middle">and your mute key</text><rect width="258" height="170" x="402" y="92" class="key" rx="14"/><path d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3" class="ink-live" transform="translate(531 152.1)"/><text x="531" y="202.1" class="title" text-anchor="middle">Virtual Headset</text><text x="531" y="221.9" class="sub" text-anchor="middle">a mic and a mute button</text><rect width="258" height="170" x="780" y="92" class="box" rx="14"/><path d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z" class="ink" transform="translate(909 143)"/><text x="909" y="193" class="title" text-anchor="middle">Zoom or Meet</text><text x="909" y="212.8" class="sub" text-anchor="middle">hears you</text><text x="909" y="231" class="sub" text-anchor="middle">and obeys your mute key</text><path d="M282 177L402 177" class="edge"/><path d="M660 177L780 177" class="edge"/></svg>