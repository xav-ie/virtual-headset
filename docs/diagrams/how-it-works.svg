  .ink { fill: none; stroke: #1d2129; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-live { fill: none; stroke: #e0245e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .seg-quiet { fill: #ffffff; stroke: #d6dae3; stroke-width: 1.5; }
  .seg-live { fill: #e0245e; fill-opacity: .2; stroke: #e0245e; stroke-width: 1.5; }
  .seg-ok { fill: #23864f; fill-opacity: .2; stroke: #23864f; stroke-width: 1.5; }
  .seg-mono { fill: #4d5566; fill-opacity: .16; stroke: #4d5566; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="286" rx="16"/><text class="head" x="24" y="36">Your call app thinks your mic is a headset, so it obeys your mute key</text><text class="lede" x="24" y="60">Virtual Headset is an ordinary USB headset, made in software</text><rect class="box" x="24" y="92" width="258" height="170" rx="14"/><path class="ink" transform="translate(153 152.1)" d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16"/><text class="title" x="153" y="202.1" text-anchor="middle">Your mic</text><text class="sub" x="153" y="221.9" text-anchor="middle">and your mute key</text><rect class="key" x="402" y="92" width="258" height="170" rx="14"/><path class="ink-live" transform="translate(531 152.1)" d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3"/><text class="title" x="531" y="202.1" text-anchor="middle">Virtual Headset</text><text class="sub" x="531" y="221.9" text-anchor="middle">a mic and a mute button</text><rect class="box" x="780" y="92" width="258" height="170" rx="14"/><path class="ink" transform="translate(909 143)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="909" y="193" text-anchor="middle">Zoom or Meet</text><text class="sub" x="909" y="212.8" text-anchor="middle">hears you</text><text class="sub" x="909" y="231" text-anchor="middle">and obeys your mute key</text><path class="edge" d="M282 177L402 177"/><path class="edge" d="M660 177L780 177"/></svg>
