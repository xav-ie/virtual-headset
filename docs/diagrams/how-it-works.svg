<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 468" width="1062" height="468" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2129; }
  .bg { fill: #f5f6f9; }
  .box { fill: #ffffff; stroke: #d6dae3; stroke-width: 2; }
  .key { fill: #e0245e; fill-opacity: .08; stroke: #e0245e; stroke-width: 2.5; }
  .head { font-size: 19px; font-weight: 700; }
  .lede { font-size: 14.5px; fill: #5d6576; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #5d6576; }
  .label { font-size: 13px; font-weight: 600; fill: #1d2129; }
  .axis { font-size: 12.5px; fill: #5d6576; }
  .axis-strong { font-size: 12.5px; font-weight: 650; fill: #1d2129; }
  .edge { fill: none; stroke: #4d5566; stroke-width: 2; marker-end: url(#arrow); }
  .tick { stroke: #5d6576; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .tag { fill: #f5f6f9; }
  .arrowhead { fill: #4d5566; }
  .badge { fill: #e0245e; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .ink { fill: none; stroke: #1d2129; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-live { fill: none; stroke: #e0245e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .seg-quiet { fill: #ffffff; stroke: #d6dae3; stroke-width: 1.5; }
  .seg-live { fill: #e0245e; fill-opacity: .2; stroke: #e0245e; stroke-width: 1.5; }
  .seg-ok { fill: #23864f; fill-opacity: .2; stroke: #23864f; stroke-width: 1.5; }
  .seg-mono { fill: #4d5566; fill-opacity: .16; stroke: #4d5566; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="468"/><text class="head" x="24" y="36">Zoom and Meet only obey a headset's mute button. Virtual Headset gives your mic one</text><text class="lede" x="24" y="60">your call app sees an ordinary USB headset: a microphone with your voice, and a mute button it listens to</text><text class="axis-strong" x="149.7" y="108" text-anchor="middle">YOU</text><text class="axis-strong" x="531" y="108" text-anchor="middle">VIRTUAL HEADSET</text><text class="axis-strong" x="912.3" y="108" text-anchor="middle">ZOOM OR MEET</text><rect class="box" x="24" y="122" width="251.3" height="128" rx="14"/><path class="ink" transform="translate(149.7 161.1)" d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16"/><text class="title" x="149.7" y="211.1" text-anchor="middle">Your mic</text><text class="sub" x="149.7" y="230.9" text-anchor="middle">built-in, USB or Bluetooth</text><rect class="box" x="24" y="276" width="251.3" height="128" rx="14"/><path class="ink" transform="translate(149.7 315.1)" d="M-21 -12h42a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-42a4 4 0 0 1 -4 -4v-18a4 4 0 0 1 4 -4zM-16 -5h2M-8 -5h2M0 -5h2M8 -5h2M16 -5h2M-12 2h2M-4 2h2M4 2h2M12 2h2M-10 8h20"/><text class="title" x="149.7" y="365.1" text-anchor="middle">Your mute key</text><text class="sub" x="149.7" y="384.9" text-anchor="middle">or menu bar, panel, browser</text><rect class="key" x="405.3" y="122" width="251.3" height="128" rx="14"/><path class="ink-live" transform="translate(531 152)" d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3"/><text class="title" x="531" y="202" text-anchor="middle">Its microphone</text><text class="sub" x="531" y="221.8" text-anchor="middle">your voice, noise removed if</text><text class="sub" x="531" y="240" text-anchor="middle">you like</text><rect class="key" x="405.3" y="276" width="251.3" height="128" rx="14"/><path class="ink-live" transform="translate(531 315.1)" d="M0 -18a18 18 0 1 1 0 36a18 18 0 1 1 0 -36zM0 -8a8 8 0 1 1 0 16a8 8 0 1 1 0 -16z"/><text class="title" x="531" y="365.1" text-anchor="middle">Its mute button</text><text class="sub" x="531" y="384.9" text-anchor="middle">pressed for you</text><rect class="box" x="786.7" y="122" width="251.3" height="128" rx="14"/><path class="ink" transform="translate(912.3 161.1)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="912.3" y="211.1" text-anchor="middle">Hears you</text><text class="sub" x="912.3" y="230.9" text-anchor="middle">as from any headset</text><rect class="box" x="786.7" y="276" width="251.3" height="128" rx="14"/><path class="ink" transform="translate(912.3 306)" d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16M-18 -18L18 18"/><text class="title" x="912.3" y="356" text-anchor="middle">Mutes</text><text class="sub" x="912.3" y="375.8" text-anchor="middle">as if you'd clicked its own</text><text class="sub" x="912.3" y="394" text-anchor="middle">button</text><path class="edge" d="M275.3 186L405.3 186"/><rect class="tag" x="298.2" y="158" width="84.2" height="22" rx="6"/><text class="label" x="305.2" y="173.5">your voice</text><path class="edge" d="M656.7 186L786.7 186"/><rect class="tag" x="679.6" y="158" width="84.2" height="22" rx="6"/><text class="label" x="686.6" y="173.5">your voice</text><path class="edge" d="M275.3 340L405.3 340"/><rect class="tag" x="315.8" y="312" width="49.1" height="22" rx="6"/><text class="label" x="322.8" y="327.5">press</text><path class="edge" d="M656.7 340L786.7 340"/><rect class="tag" x="697.1" y="312" width="49.1" height="22" rx="6"/><text class="label" x="704.1" y="327.5">press</text><path class="edge" d="M912.3 404L912.3 438L149.7 438L149.7 404"/><rect class="tag" x="362.5" y="426" width="336.9" height="22" rx="6"/><text class="label" x="369.5" y="441.5">and tells your menu bar and panel you're muted</text></svg>
