<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="352" role="img" viewBox="0 0 1062 352"><style>text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#1d2129}.bg{fill:#f5f6f9}.box{fill:#fff;stroke:#d6dae3;stroke-width:2}.key{fill:#e0245e;fill-opacity:.08;stroke:#e0245e;stroke-width:2.5}.head{font-size:19px;font-weight:700}.lede{font-size:14.5px;fill:#5d6576}.title{font-size:16px;font-weight:650}.sub{font-size:13.5px;fill:#5d6576}.label{font-size:13px;font-weight:600;fill:#1d2129}.edge{fill:none;stroke:#4d5566;stroke-width:2;marker-end:url(#arrow)}.tag{fill:#f5f6f9}.arrowhead{fill:#4d5566}.badge{fill:#e0245e}.ink,.ink-live{fill:none;stroke:#1d2129;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.ink-live{stroke:#e0245e}</style><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect width="1062" height="352" class="bg" rx="16"/><text x="24" y="36" class="head">Mute from anywhere, and everything agrees</text><text x="24" y="60" class="lede">every mute goes to your call app, which decides, and every indicator shows what it decided</text><rect width="251.3" height="236" x="24" y="92" class="box" rx="14"/><path d="M-21 -12h42a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-42a4 4 0 0 1 -4 -4v-18a4 4 0 0 1 4 -4zM-16 -5h2M-8 -5h2M0 -5h2M8 -5h2M16 -5h2M-12 2h2M-4 2h2M4 2h2M12 2h2M-10 8h20" class="ink" transform="translate(149.7 126.7)"/><text x="149.7" y="176.7" class="title" text-anchor="middle">Press mute anywhere</text><circle cx="46" cy="203.8" r="3" class="badge"/><text x="58" y="208.3" class="sub">a key</text><circle cx="46" cy="228.8" r="3" class="badge"/><text x="58" y="233.3" class="sub">your menu or status bar</text><circle cx="46" cy="253.8" r="3" class="badge"/><text x="58" y="258.3" class="sub">the panel</text><circle cx="46" cy="278.8" r="3" class="badge"/><text x="58" y="283.3" class="sub">the Firefox toolbar</text><circle cx="46" cy="303.8" r="3" class="badge"/><text x="58" y="308.3" class="sub">Zoom or Meet&apos;s own button</text><rect width="251.3" height="236" x="405.3" y="92" class="key" rx="14"/><path d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z" class="ink-live" transform="translate(531 185.1)"/><text x="531" y="235.1" class="title" text-anchor="middle">Zoom or Meet mutes</text><text x="531" y="254.9" class="sub" text-anchor="middle">the one place mute is decided</text><rect width="251.3" height="236" x="786.7" y="92" class="box" rx="14"/><path d="M-6 -20h12v18a6 6 0 0 1 -12 0zM-6 -20a6 6 0 0 1 12 0M-13 -4a13 13 0 0 0 26 0M0 9v11M-8 20h16M-18 -18L18 18" class="ink" transform="translate(912.3 139.2)"/><text x="912.3" y="189.2" class="title" text-anchor="middle">It shows everywhere</text><circle cx="808.7" cy="216.3" r="3" class="badge"/><text x="820.7" y="220.8" class="sub">your menu or status bar</text><circle cx="808.7" cy="241.3" r="3" class="badge"/><text x="820.7" y="245.8" class="sub">the panel</text><circle cx="808.7" cy="266.3" r="3" class="badge"/><text x="820.7" y="270.8" class="sub">the Firefox toolbar</text><circle cx="808.7" cy="291.3" r="3" class="badge"/><text x="820.7" y="295.8" class="sub">Zoom or Meet</text><path d="M275.3 210L405.3 210" class="edge"/><rect width="42.1" height="22" x="319.3" y="182" class="tag" rx="6"/><text x="326.3" y="197.5" class="label">mute</text><path d="M656.7 210L786.7 210" class="edge"/><rect width="49.1" height="22" x="697.1" y="182" class="tag" rx="6"/><text x="704.1" y="197.5" class="label">muted</text></svg>