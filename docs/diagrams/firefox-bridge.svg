<svg xmlns="http://www.w3.org/2000/svg" width="1062" height="276" role="img" viewBox="0 0 1062 276"><style>text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#1d2129}.bg{fill:#f5f6f9}.box{fill:#fff;stroke:#d6dae3;stroke-width:2}.key{fill:#e0245e;fill-opacity:.08;stroke:#e0245e;stroke-width:2.5}.head{font-size:19px;font-weight:700}.lede{font-size:14.5px;fill:#5d6576}.title{font-size:16px;font-weight:650}.sub{font-size:13.5px;fill:#5d6576}.label{font-size:13px;font-weight:600;fill:#1d2129}.edge{fill:none;stroke:#4d5566;stroke-width:2;marker-end:url(#arrow)}.tag{fill:#f5f6f9}.arrowhead{fill:#4d5566}.ink,.ink-live{fill:none;stroke:#1d2129;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.ink-live{stroke:#e0245e}</style><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect width="1062" height="276" class="bg" rx="16"/><text x="24" y="36" class="head">Firefox can&apos;t use headsets, so the extension presses the button for you</text><text x="24" y="60" class="lede">it clicks the Zoom or Meet tab&apos;s own mic button, and tells Virtual Headset when you click it yourself</text><rect width="169.5" height="160" x="24" y="92" class="key" rx="14"/><path d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3" class="ink-live" transform="translate(108.8 138)"/><text x="108.8" y="188" class="title" text-anchor="middle">Virtual Headset</text><text x="108.8" y="207.8" class="sub" text-anchor="middle">knows whether</text><text x="108.8" y="226" class="sub" text-anchor="middle">you&apos;re muted</text><rect width="169.5" height="160" x="305.5" y="92" class="box" rx="14"/><path d="M-7 -20v10M7 -20v10M-13 -10h26v8a13 13 0 0 1 -26 0zM0 11v10" class="ink" transform="translate(390.3 138)"/><text x="390.3" y="188" class="title" text-anchor="middle">Helper</text><text x="390.3" y="207.8" class="sub" text-anchor="middle">lets Firefox talk</text><text x="390.3" y="226" class="sub" text-anchor="middle">to Virtual Headset</text><rect width="169.5" height="160" x="587" y="92" class="box" rx="14"/><path d="M-16 -16h10a5 5 0 1 1 10 0h12v12a5 5 0 1 0 0 10v12h-12a5 5 0 1 1 -10 0h-10z" class="ink" transform="translate(671.8 138)"/><text x="671.8" y="188" class="title" text-anchor="middle">Firefox extension</text><text x="671.8" y="207.8" class="sub" text-anchor="middle">a mic in your</text><text x="671.8" y="226" class="sub" text-anchor="middle">toolbar</text><rect width="169.5" height="160" x="868.5" y="92" class="box" rx="14"/><path d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z" class="ink" transform="translate(953.3 138)"/><text x="953.3" y="188" class="title" text-anchor="middle">Zoom or Meet tab</text><text x="953.3" y="207.8" class="sub" text-anchor="middle">with its own mic</text><text x="953.3" y="226" class="sub" text-anchor="middle">button</text><path d="M193.5 157L305.5 157" class="edge"/><path d="M305.5 187L193.5 187" class="edge"/><path d="M475 157L587 157" class="edge"/><path d="M587 187L475 187" class="edge"/><path d="M756.5 157L868.5 157" class="edge"/><rect width="91.2" height="22" x="766.9" y="129" class="tag" rx="6"/><text x="773.9" y="144.5" class="label">clicks mute</text><path d="M868.5 187L756.5 187" class="edge"/><rect width="84.2" height="22" x="770.4" y="193" class="tag" rx="6"/><text x="777.4" y="208.5" class="label">reads mute</text></svg>