<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 276" width="1062" height="276" role="img"><style>
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1d2129; }
  .bg { fill: #f5f6f9; }
  .box { fill: #ffffff; stroke: #d6dae3; stroke-width: 2; }
  .key { fill: #e0245e; fill-opacity: .08; stroke: #e0245e; stroke-width: 2.5; }
  .head { font-size: 19px; font-weight: 700; }
  .lede { font-size: 14.5px; fill: #5d6576; }
  .title { font-size: 16px; font-weight: 650; }
  .sub { font-size: 13.5px; fill: #5d6576; }
  .label { font-size: 13px; font-weight: 600; fill: #1d2129; }
  .axis { font-size: 12.5px; fill: #5d6576; }
  .axis-strong { font-size: 12.5px; font-weight: 650; fill: #1d2129; }
  .edge { fill: none; stroke: #4d5566; stroke-width: 2; marker-end: url(#arrow); }
  .spoke { stroke: #d6dae3; stroke-width: 2.5; }
  .tick { stroke: #5d6576; stroke-width: 1.5; stroke-dasharray: 4 4; }
  .tag { fill: #f5f6f9; }
  .arrowhead { fill: #4d5566; }
  .badge { fill: #e0245e; }
  .badge-text { font-size: 12px; font-weight: 700; fill: #ffffff; }
  .ink { fill: none; stroke: #1d2129; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .ink-live { fill: none; stroke: #e0245e; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .seg-quiet { fill: #ffffff; stroke: #d6dae3; stroke-width: 1.5; }
  .seg-live { fill: #e0245e; fill-opacity: .2; stroke: #e0245e; stroke-width: 1.5; }
  .seg-ok { fill: #23864f; fill-opacity: .2; stroke: #23864f; stroke-width: 1.5; }
  .seg-mono { fill: #4d5566; fill-opacity: .16; stroke: #4d5566; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="276" rx="16"/><text class="head" x="24" y="36">Firefox can't use headsets, so the extension presses the button for you</text><text class="lede" x="24" y="60">it clicks the Zoom or Meet tab's own mic button, and tells Virtual Headset when you click it yourself</text><rect class="key" x="24" y="92" width="169.5" height="160" rx="14"/><path class="ink-live" transform="translate(108.8 138)" d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3"/><text class="title" x="108.8" y="188" text-anchor="middle">Virtual Headset</text><text class="sub" x="108.8" y="207.8" text-anchor="middle">knows whether</text><text class="sub" x="108.8" y="226" text-anchor="middle">you're muted</text><rect class="box" x="305.5" y="92" width="169.5" height="160" rx="14"/><path class="ink" transform="translate(390.3 138)" d="M-7 -20v10M7 -20v10M-13 -10h26v8a13 13 0 0 1 -26 0zM0 11v10"/><text class="title" x="390.3" y="188" text-anchor="middle">Helper</text><text class="sub" x="390.3" y="207.8" text-anchor="middle">lets Firefox talk</text><text class="sub" x="390.3" y="226" text-anchor="middle">to Virtual Headset</text><rect class="box" x="587" y="92" width="169.5" height="160" rx="14"/><path class="ink" transform="translate(671.8 138)" d="M-16 -16h10a5 5 0 1 1 10 0h12v12a5 5 0 1 0 0 10v12h-12a5 5 0 1 1 -10 0h-10z"/><text class="title" x="671.8" y="188" text-anchor="middle">Firefox extension</text><text class="sub" x="671.8" y="207.8" text-anchor="middle">a mic in your</text><text class="sub" x="671.8" y="226" text-anchor="middle">toolbar</text><rect class="box" x="868.5" y="92" width="169.5" height="160" rx="14"/><path class="ink" transform="translate(953.3 138)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="953.3" y="188" text-anchor="middle">Zoom or Meet tab</text><text class="sub" x="953.3" y="207.8" text-anchor="middle">with its own mic</text><text class="sub" x="953.3" y="226" text-anchor="middle">button</text><path class="edge" d="M193.5 157L305.5 157"/><path class="edge" d="M305.5 187L193.5 187"/><path class="edge" d="M475 157L587 157"/><path class="edge" d="M587 187L475 187"/><path class="edge" d="M756.5 157L868.5 157"/><rect class="tag" x="766.9" y="129" width="91.2" height="22" rx="6"/><text class="label" x="773.9" y="144.5">clicks mute</text><path class="edge" d="M868.5 187L756.5 187"/><rect class="tag" x="770.4" y="193" width="84.2" height="22" rx="6"/><text class="label" x="777.4" y="208.5">reads mute</text></svg>
