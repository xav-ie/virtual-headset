  .seg-ok { fill: #23864f; fill-opacity: .2; stroke: #23864f; stroke-width: 1.5; }
  .seg-mono { fill: #4d5566; fill-opacity: .16; stroke: #4d5566; stroke-width: 1.5; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs><rect class="bg" width="1062" height="316"/><text class="head" x="24" y="36">Mute from anywhere, and everything agrees</text><text class="lede" x="24" y="60">a mute is one loop through the call app, so no indicator can fall out of step</text><rect class="box" x="24" y="92" width="224.7" height="170" rx="14"/><path class="ink" transform="translate(136.3 143)" d="M-21 -12h42a4 4 0 0 1 4 4v18a4 4 0 0 1 -4 4h-42a4 4 0 0 1 -4 -4v-18a4 4 0 0 1 4 -4zM-16 -5h2M-8 -5h2M0 -5h2M8 -5h2M16 -5h2M-12 2h2M-4 2h2M4 2h2M12 2h2M-10 8h20"/><text class="title" x="136.3" y="193" text-anchor="middle">Your mute controls</text><text class="sub" x="136.3" y="212.8" text-anchor="middle">a key, your menu or status</text><text class="sub" x="136.3" y="231" text-anchor="middle">bar, a panel, the browser</text><rect class="key" x="418.7" y="92" width="224.7" height="170" rx="14"/><path class="ink-live" transform="translate(531 152.1)" d="M-17 6v-6a17 17 0 0 1 34 0v6M-21 2h6v14h-6zM15 2h6v14h-6zM-18 16q0 8 12 8M-5 24h3"/><text class="title" x="531" y="202.1" text-anchor="middle">Virtual Headset</text><text class="sub" x="531" y="221.9" text-anchor="middle">its mute button and light</text><rect class="box" x="813.3" y="92" width="224.7" height="170" rx="14"/><path class="ink" transform="translate(925.7 143)" d="M-23 -17h46a3 3 0 0 1 3 3v28a3 3 0 0 1 -3 3h-46a3 3 0 0 1 -3 -3v-28a3 3 0 0 1 3 -3zM-26 -9h52M-18 -3h16v8h-16zM2 -3h16v8h-16zM-18 8h16v4h-16zM2 8h16v4h-16z"/><text class="title" x="925.7" y="193" text-anchor="middle">Zoom or Meet</text><text class="sub" x="925.7" y="212.8" text-anchor="middle">mutes itself, as for a</text><text class="sub" x="925.7" y="231" text-anchor="middle">real headset</text><path class="edge" d="M248.7 162L418.7 162"/><rect class="tag" x="265.5" y="134" width="136.3" height="22" rx="6"/><circle class="badge" cx="278.5" cy="145" r="9.5"/><text class="badge-text" x="278.5" y="149.5" text-anchor="middle">1</text><text class="label" x="296.5" y="149.5">you press mute</text><path class="edge" d="M418.7 192L248.7 192"/><rect class="tag" x="276.1" y="198" width="115.2" height="22" rx="6"/><circle class="badge" cx="289.1" cy="209" r="9.5"/><text class="badge-text" x="289.1" y="213.5" text-anchor="middle">4</text><text class="label" x="307.1" y="213.5">shows muted</text><path class="edge" d="M643.3 162L813.3 162"/><rect class="tag" x="667.2" y="134" width="122.2" height="22" rx="6"/><circle class="badge" cx="680.2" cy="145" r="9.5"/><text class="badge-text" x="680.2" y="149.5" text-anchor="middle">2</text><text class="label" x="698.2" y="149.5">button press</text><path class="edge" d="M813.3 192L643.3 192"/><rect class="tag" x="674.2" y="198" width="108.2" height="22" rx="6"/><circle class="badge" cx="687.2" cy="209" r="9.5"/><text class="badge-text" x="687.2" y="213.5" text-anchor="middle">3</text><text class="label" x="705.2" y="213.5">mute light</text><text class="sub" x="531" y="296" text-anchor="middle">Mute inside Zoom or Meet instead, and it starts at 3: the call app lights the mute light, and your controls follow.</text></svg>
