name: Security

# CodeQL code scanning and dependency review. Both need a public repository
# (or GitHub Advanced Security), so they only run while this one is public.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, for newly published queries and advisories

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # The Rust daemon, the TypeScript extension and panel, and these workflows. The macOS app's
  # Swift is codeql-swift's.
  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  # The macOS app's Swift, traced from a direct swiftc build: the Nix build runs in
  # the daemon, out of CodeQL's sight. Paths.swift is generated by the package, so
  # a stub stands in for it. It calls the toolchain's swiftc, since the /usr/bin
  # shim is SIP-protected and CodeQL can't trace through it, and builds for
  # x86_64 with the SDK given: CodeQL's Swift bundle is x86_64, so its tracer runs
  # the compiler under Rosetta and only sees an x86_64 build.
  codeql-swift:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
      # CodeQL's extractor can't read the PCH Xcode's compiler would make of the
      # bridging header (a newer format), so the header is parsed directly.
      - name: Build the macOS app's sources
        run: |
          printf 'let DFN_LADSPA = ""\nlet FFMPEG = ""\n' > "$RUNNER_TEMP/Paths.swift"
          "$(xcrun --find swiftc)" -target x86_64-apple-macos14 -sdk "$(xcrun --show-sdk-path)" \
            -import-objc-header packages/virtual-headset-macos/ladspa.h -disable-bridging-pch \
            packages/virtual-headset-macos/*.swift "$RUNNER_TEMP/Paths.swift" \
            -o "$RUNNER_TEMP/virtual-headset"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift

  # Flags pull requests that add dependencies with known vulnerabilities.
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
