name: CodeQL Swift

# The macOS app's Swift, apart from security.yml because it is slow: the
# tracer runs the compiler under Rosetta (below). Pull requests run it only
# when they change what it compiles; main and the weekly run always do.
on:
  pull_request:
    paths:
      - .github/workflows/codeql-swift.yml
      - flake.lock
      - packages/virtual-headset-macos/**
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly, for newly published queries

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Traced from a direct swiftc build: the Nix build runs in the daemon, out of
  # CodeQL's sight. Paths.swift is generated by the package, so a stub stands in
  # for it. It calls the toolchain's swiftc, since the /usr/bin shim is
  # SIP-protected and CodeQL can't trace through it, and builds for x86_64 with
  # the SDK given: CodeQL's Swift bundle is x86_64, so its tracer runs the
  # compiler under Rosetta and only sees an x86_64 build.
  codeql-swift:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The panel library the app imports, at the revision flake.lock pins, built
      # as a module with the same compiler and target as the app. It is built
      # before CodeQL starts tracing: bar-panels scans its own code.
      - name: Build BarPanels
        run: |
          bp="$RUNNER_TEMP/bar-panels"
          git clone --quiet https://github.com/xav-ie/bar-panels "$bp"
          git -C "$bp" checkout --quiet "$(jq -r '.nodes["bar-panels"].locked.rev' flake.lock)"
          "$(xcrun --find swiftc)" -target x86_64-apple-macos14 -sdk "$(xcrun --show-sdk-path)" \
            -parse-as-library -module-name BarPanels \
            -emit-library -static -o "$RUNNER_TEMP/libBarPanels.a" \
            -emit-module -emit-module-path "$RUNNER_TEMP/BarPanels.swiftmodule" \
            "$bp"/Sources/BarPanels/*.swift
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      # CodeQL's extractor can't read the PCH Xcode's compiler would make of the
      # bridging header (a newer format), so the header is parsed directly.
      - name: Build the macOS app's sources
        run: |
          printf 'let DFN_LADSPA = ""\nlet FFMPEG = ""\n' > "$RUNNER_TEMP/Paths.swift"
          "$(xcrun --find swiftc)" -target x86_64-apple-macos14 -sdk "$(xcrun --show-sdk-path)" \
            -I "$RUNNER_TEMP" -L "$RUNNER_TEMP" -lBarPanels \
            -import-objc-header packages/virtual-headset-macos/ladspa.h -disable-bridging-pch \
            packages/virtual-headset-macos/*.swift "$RUNNER_TEMP/Paths.swift" \
            -o "$RUNNER_TEMP/virtual-headset"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:swift
