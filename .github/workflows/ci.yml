name: CI

# Run once per change: `pull_request` covers branches/PRs, `push` only on main
# (post-merge). Scoping push to main avoids the double run you'd get when a
# same-repo branch has an open PR (push + pull_request both firing).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # the Nix installer's FlakeHub login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The NixOS VM tests (modules / runtime / extension) boot QEMU, so the
      # runner needs KVM access — and three NixOS closures overflow the default
      # ~14 GB disk, so reclaim space first.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Builds all packages, runs the NixOS VM tests + TypeScript unit tests,
      # and checks formatting and the generated docs.
      - run: nix flake check --no-write-lock-file
