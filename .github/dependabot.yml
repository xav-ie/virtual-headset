version: 2

updates:
  # The cooldown waits 14 days after a release before proposing it, so a
  # compromised release that gets yanked within days never lands here. Minor
  # and patch updates come grouped; each major version comes on its own, since
  # those can need code changes. npm isn't here: its lockfiles are pinned by
  # hash in the Nix builds, so an update needs that hash refreshed by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /packages/virtual-headset
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
